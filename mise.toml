# Adapted from go-cli-sdk-template (a4d314c): template/mise.toml, on one module.
# Adapted from web-app-sdk (fbaba50): mise.toml, its settings, preflight, install, and lint tasks.
# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# The CLI's toolchain, and the toolchain of the project it writes: node, pnpm, shellcheck,
# typescript-go, and chrome-headless-shell are internal/starter/files/mise.toml.tmpl's pins, each
# entry as it writes it (starter_test.go holds them equal), so the integration tier's full proof
# installs and checks a written project with no network.
[tools]
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
node = "26.13.1"
pnpm = "12.21.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# Chrome for Testing publishes no checksums: take the sha256 and size from each platform's download
# by hand at each bump, the starter's with them.
[tools."http:chrome-headless-shell"]
version = "158.0.8127.36"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:2d3a23017323c54fd457a678e4351f895c4076d8050e39d5aa6247f93448b73a", size = "132087165" }
linux-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux-arm64/chrome-headless-shell-linux-arm64.zip", checksum = "sha256:176ee5c55486c22de43128871189061365ea28e881fc96016fd18e7cb59437c8", size = "129938239" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chrome-headless-shell-mac-x64.zip", checksum = "sha256:e0c5d07d8f5bcc5bdd5ef370e7daf3770856b585fcc9eecf441c7e3bb2e3d1cf", size = "112306247" }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-headless-shell-mac-arm64.zip", checksum = "sha256:c24d40a3786322ff3a5e3ac6eed162226cbaf07ebe468715407827226b0f8897", size = "105057133" }

# The module is built alone, never in a workspace a parent directory holds.
[env]
GOWORK = "off"

[tasks.preflight]
description = "Fail naming mise run install when a tool or module the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

# The pnpm store is the full proof's: a written project installs its packages from it, offline.
[tasks.install]
description = "Install the pins, the module's requirements, and the starter's packages into .cache/pnpm-store; reads the network"
run = ["mise install", "go mod download", "scripts/fetch-store.sh"]

# vet reads the integration suite too, so it compiles and lints with the rest.
[tasks.vet]
description = "Build, vet, and check the format, fixes, and go.mod; writes nothing"
depends = ["preflight"]
run = '''
set -eu
go build ./...
go vet ./...
go vet -tags integration ./...
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
go fix -diff ./...
go fix -tags integration -diff ./...
go mod tidy -diff
'''

[tasks.lint]
description = "Run the linters: golangci-lint, shellcheck, and actionlint"
depends = ["lint:go", "lint:shell", "lint:workflows"]

[tasks."lint:go"]
description = "Lint the Go source with golangci-lint, the integration suite included"
depends = ["preflight"]
run = ["golangci-lint run ./...", "golangci-lint run --build-tags integration ./..."]

[tasks."lint:shell"]
description = "Shellcheck the scripts"
depends = ["preflight"]
run = "shellcheck scripts/*.sh"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint"
depends = ["preflight"]
run = "actionlint"

[tasks."test:unit"]
description = "Run the unit tier"
depends = ["preflight"]
run = "go test -race ./..."

# The integration tier runs the built CLI as a subprocess, one shot at a time. Its full proof
# writes a project with --install, offline from the pins and .cache/pnpm-store, and runs the
# project's own check.
[tasks."test:integration"]
description = "Run the integration tier against the built CLI, the full proof of a written project included"
depends = ["preflight"]
run = "go test -race -count=1 -tags integration ./integration/"

[tasks.check]
description = "Run every check: vet, lint, and the unit and integration tiers; reads no network; writes nothing"
depends = ["vet", "lint", "test:unit", "test:integration"]

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.currency]
description = "Report the go directive, each direct requirement, mise tool, and action pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
