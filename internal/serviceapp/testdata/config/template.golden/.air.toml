# The service's live reload under air, which mise run dev runs.
# Adapted from herald (c697566): .air.toml, for the service's server and its web client.
root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
cmd = "go build -o ./tmp/main ./cmd/server"
delay = 1000
exclude_dir = ["tmp", "bin", "client/node_modules", "client/src", "client/test", "client/scripts"]
include_ext = ["go", "js", "css"]
kill_delay = 500
send_interrupt = true

[log]
time = false

[misc]
clean_on_exit = true
