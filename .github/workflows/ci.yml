# Adapted from web-app-sdk (fbaba50): .github/workflows/ci.yml, its comment for the CLI's pins.
# mise run install installs every pin mise.toml names, the chrome-headless-shell the written
# project's browser tier runs in included, the module's requirements, and the starter's packages
# into .cache/pnpm-store; the check then runs offline, the integration tier's full proof included.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.3.0

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check
