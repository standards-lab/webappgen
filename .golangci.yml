# golangci-lint v2 configuration, run by `mise run check`: the standard set plus nolintlint and
# testpackage.
# See architecture/principles/comments.md
# Adapted from go-cli-sdk-template (a4d314c): template/.golangci.yml, run on the one module.
version: "2"

linters:
  default: standard
  enable:
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
